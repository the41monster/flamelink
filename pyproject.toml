[project]
name = "flamelink"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "py-spy>=0.4.2",
    "uvicorn",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flamelink*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
