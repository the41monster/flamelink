[project]
name = "flamelink"
version = "0.1.0"
requires-python = ">=3.14"

dependencies = [
    "fastapi",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "py-spy>=0.4.2",
    "rich>=15.0.0",
    "uvicorn",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["flamelink*"]

[tool.setuptools.package-data]
flamelink = ["schemas/*.json"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rfc3339-validator>=0.1.4",
]

[tool.pytest.ini_options]
markers = ["integration: runs real profilers and servers (slow, needs node/clinic or sudo)"]
